name: Deploy staging to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-staging
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate staging artifact
        run: |
          python3 - <<'PYTHON'
          import json,re
          from pathlib import Path
          p=Path('site');m=json.loads((p/'build-manifest.json').read_text())
          assert m['noindex'] is True and m['base_path']=='/civitassolis-staging'
          assert re.fullmatch('[0-9a-f]{40}',m['source_commit'])
          assert not (p/'CNAME').exists()
          assert (p/'index.html').is_file()
          for name in m['pages']:
              f=(p/name).resolve()
              assert f.is_relative_to(p.resolve()) and f.is_file()
              if name!='404.html': assert 'noindex, nofollow' in f.read_text()
          print('Validated source:',m['source_commit'])
          PYTHON
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
  deploy:
    needs: upload
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
